name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        # mcp2cli supports both MCP SDK majors (issue #74), so all three are
        # tested: the declared floor, the latest 1.x, and the latest 2.x.
        # Testing a single pinned SDK is how the 2.0.0 break reached users
        # while CI stayed green (issue #68).
        mcp: ["mcp==1.26.0", "mcp<2", "mcp>=2,<3"]
    name: test (py${{ matrix.python }}, ${{ matrix.mcp }})
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv venv --python ${{ matrix.python }}

      # --no-deps, then install the matrix SDK explicitly, so the pin under
      # test is the one that gets exercised rather than whatever resolves.
      - run: uv pip install -e . --no-deps
      - run: uv pip install "${{ matrix.mcp }}" httpx pyyaml pytest pytest-asyncio tiktoken

      # The --toon tests assert real encoder output. Installing the CLI here
      # puts `toon` on PATH, so they exercise it deterministically instead of
      # relying on npx fetching the package mid-test: runners ship npx but not
      # the package, and that implicit download raced _toon_encode's 10s
      # timeout — 5 matrix jobs won it, 1 lost, so main went red at random.
      - run: npm install -g @toon-format/cli

      - name: Report resolved versions
        run: .venv/bin/python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - run: .venv/bin/python -m pytest -q

  # Path handling, process spawning and the session transport all branch on
  # the platform, and the POSIX matrix never reaches those branches — the
  # AF_UNIX-only session code shipped green for exactly that reason. One
  # Windows job per supported SDK major is enough to catch a regression here;
  # it does not need the full Python range.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
        mcp: ["mcp<2", "mcp>=2,<3"]
    name: windows (py${{ matrix.python }}, ${{ matrix.mcp }})
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv venv --python ${{ matrix.python }}

      - run: uv pip install -e . --no-deps
      - run: uv pip install "${{ matrix.mcp }}" httpx pyyaml pytest pytest-asyncio tiktoken

      - name: Report resolved versions
        run: .venv/Scripts/python.exe -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      # The --toon tests shell out to a Node encoder and say nothing about the
      # platform; skipping them keeps this job about Windows behaviour.
      - run: .venv/Scripts/python.exe -m pytest -q -k "not toon"

  publish:
    needs: [test, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv build

      - run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
